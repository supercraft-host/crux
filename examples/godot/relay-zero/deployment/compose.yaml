services:
  server:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "${PORT:-9080}:${PORT:-9080}"
    environment:
      CRUX_URL: ${CRUX_URL:-https://crux.supercraft.host}
      CRUX_PROJECT_ID: ${CRUX_PROJECT_ID:?}
      CRUX_ENVIRONMENT_ID: ${CRUX_ENVIRONMENT_ID:?}
      CRUX_SERVER_TOKEN: ${CRUX_SERVER_TOKEN:?}
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:?}
      PORT: ${PORT:-9080}
      REGION: ${REGION:-eu-west}
      MATCH_ID: ${MATCH_ID:-}
      EXPECTED_JOIN_TOKEN: ${EXPECTED_JOIN_TOKEN:-}
      RELAY_ALLOW_INSECURE_DEV_AUTH: ${RELAY_ALLOW_INSECURE_DEV_AUTH:-0}
      LEADERBOARD_WEEKLY_ID: ${LEADERBOARD_WEEKLY_ID:-}
      LEADERBOARD_FASTEST_ID: ${LEADERBOARD_FASTEST_ID:-}
    restart: unless-stopped
    stop_grace_period: 30s
