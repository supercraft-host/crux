# Relay Zero Client Configuration
#
# Generate this file for your own Crux project:
#
#   python3 tools/configure_demo.py \
#     --project-id <uuid> --environment-id <uuid> \
#     --client-api-key <key> --server-token <token> \
#     --weekly-leaderboard-id <uuid> --fastest-leaderboard-id <uuid>
#
# Placeholder values make the client boot into offline solo training, so the
# project is playable before any backend exists.

[crux]
url="https://crux.supercraft.host"
project_id="your-project-id-here"
env_id="your-environment-id-here"
api_key="your-client-api-key-here"

[match]
default_region="eu-west"
default_mode="quick"
